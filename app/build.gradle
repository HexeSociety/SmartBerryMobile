plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

if (file('google-services.json').exists() || file('src/debug/google-services.json').exists()
        || file('src/release/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def debugFirebaseConfig = file('src/debug/google-services.json')
if (!debugFirebaseConfig.exists()) {
    debugFirebaseConfig = file('google-services.json')
}
def firebasePackages = debugFirebaseConfig.exists()
        ? new groovy.json.JsonSlurper().parse(debugFirebaseConfig).client.collect {
            it.client_info.android_client_info.package_name
        }
        : []
def useParallelAuthApp = providers.gradleProperty('SMARTBERRY_AUTH_TEST_APP').map {
    it.toBoolean()
}.getOrElse(firebasePackages.contains('com.example.smartberry.auth')
        && !firebasePackages.contains('com.example.smartberry'))

android {
    namespace 'com.example.smartberry'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.smartberry"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        def config = [SMARTBERRY_API_URL: 'http://10.0.2.2:8080',
                      SMARTBERRY_ESP32_ID: '', SMARTBERRY_API_KEY: '']
        config.each { name, fallback ->
            def value = providers.gradleProperty(name).orElse(providers.environmentVariable(name))
                    .getOrElse(fallback)
            buildConfigField 'String', name, groovy.json.JsonOutput.toJson(value)
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            if (useParallelAuthApp) {
                applicationIdSuffix '.auth'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.cardview
    implementation libs.lifecycle.runtime.ktx
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.material3
    implementation libs.material3.adaptive.navigation.suite
    implementation libs.ui
    implementation libs.ui.graphics
    implementation libs.ui.tooling.preview
    testImplementation libs.junit
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ui.test.junit4
    debugImplementation libs.ui.test.manifest
    debugImplementation libs.ui.tooling
}